name: mindlift-prod

services:
  postgres:
    image: postgres:16
    container_name: mindlift-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindlift}
      POSTGRES_USER: ${POSTGRES_USER:-mindlift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindlift} -d ${POSTGRES_DB:-mindlift}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindlift-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindlift-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mindlift};Username=${POSTGRES_USER:-mindlift};Password=${POSTGRES_PASSWORD:?Database password required}"
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT signing key required}"
      Jwt__Issuer: "${JWT_ISSUER:-https://app.mindlift.io}"
      Jwt__Audience: "${JWT_AUDIENCE:-mindlift-api}"
      # Encrypts the mail passwords, provider tokens and webhook secrets a workspace stores. Use a long random value that is not the signing key.
      Security__SecretKey: "${SECRET_KEY:?Secret key required}"
      # The public address of the app. It is put into emailed links (sign-in, invitations, reminders) and used to check Twilio webhook signatures.
      App__BaseUrl: "${APP_BASE_URL:?Public address of the app required, for example https://crm.example.com}"
      # WhatsApp: the token you give Meta when you register the webhook. Leave empty if WhatsApp is not used.
      Communication__WhatsAppVerifyToken: "${WHATSAPP_VERIFY_TOKEN:-}"
      # Behind a reverse proxy, set FORWARDED_HEADERS_ENABLED=true and name the proxy so rate limits count each customer.
      ForwardedHeaders__Enabled: "${FORWARDED_HEADERS_ENABLED:-false}"
      ForwardedHeaders__KnownProxies__0: "${FORWARDED_PROXY_ADDRESS:-127.0.0.1}"
      Ocr__TesseractPath: "/usr/bin/tesseract"
      Ocr__Languages: "eng+ara"
      # AI reading of document fields (see docs/ADMIN_GUIDE.md, section 3b). Off until LLM_PROVIDER=Ollama and a model is installed.
      Llm__Provider: "${LLM_PROVIDER:-None}"
      Llm__BaseUrl: "${LLM_BASE_URL:-http://host.docker.internal:11434}"
      Llm__Model: "${LLM_MODEL:-qwen2.5:7b-instruct}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mindlift-network

networks:
  mindlift-network:
    driver: bridge

volumes:
  postgres-data:
