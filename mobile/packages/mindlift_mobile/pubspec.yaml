name: mindlift_mobile
description: MindLift CRM Staff-Facing Mobile Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  mindlift_ui:
    path: ../mindlift_ui
  mindlift_api:
    path: ../mindlift_api
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_secure_storage: ^9.0.0
  drift: ^2.16.0
  sqlcipher_flutter_libs: ^0.5.4
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.0
  local_auth: ^2.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^17.2.3
  record: ^6.0.0
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true


dependency_overrides:
  record_android: 1.3.3
