<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindLift</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/MindLift.UI/css/mindlift.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/platform.css" />
    <link rel="stylesheet" href="css/dash.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#f8fafc;font-family:'Inter',system-ui,sans-serif;padding:32px 16px;">
            <div style="margin-top:24px;margin-bottom:28px;display:flex;align-items:center;gap:8px;">
                <span style="font-size:1.6rem;font-weight:800;color:#2563eb;letter-spacing:-0.5px;">MindLift</span>
            </div>
            <div style="width:100%;max-width:420px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0;padding:32px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">
                <h1 style="font-size:1.5rem;font-weight:700;color:#0f172a;margin:0 0 6px 0;">Welcome back</h1>
                <p style="font-size:0.875rem;color:#64748b;margin:0 0 24px 0;">Sign in to your MindLift workspace.</p>
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div>
                        <label style="display:block;font-size:0.8rem;font-weight:600;color:#475569;margin-bottom:6px;">Email</label>
                        <input type="email" placeholder="name@company.com" style="width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;box-sizing:border-box;outline:none;" />
                    </div>
                    <div>
                        <label style="display:block;font-size:0.8rem;font-weight:600;color:#475569;margin-bottom:6px;">Password</label>
                        <input type="password" placeholder="••••••••" style="width:100%;padding:10px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;box-sizing:border-box;outline:none;" />
                    </div>
                    <button id="initial-signin-btn" onclick="this.textContent='Starting MindLift...';this.disabled=true;this.style.opacity='0.75';" style="margin-top:8px;width:100%;padding:12px;background:#2563eb;color:#ffffff;border:none;border-radius:8px;font-weight:600;font-size:0.95rem;cursor:pointer;transition:all 0.2s;">Sign in</button>
                    <div style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:0.75rem;color:#94a3b8;margin-top:4px;">
                        <span style="display:inline-block;width:10px;height:10px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:mlspin 0.8s linear infinite;"></span>
                        Loading workspace runtime...
                    </div>
                </div>
            </div>
            <style>@keyframes mlspin{to{transform:rotate(360deg)}}</style>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Called from Blazor (IJSRuntime). Theme and language live on <html> so CSS tokens and RTL switch.
        window.mindlift = {
            // Fades colours between dark and light instead of flipping at once. The fade class is only on while the switch happens.
            setTheme: function (theme) {
                var root = document.documentElement;
                if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    root.classList.add('ml-theme-fade');
                    clearTimeout(window.mindlift._fade);
                    window.mindlift._fade = setTimeout(function () { root.classList.remove('ml-theme-fade'); }, 450);
                }
                root.setAttribute('data-theme', theme);
            },
            // Sets the page language and direction without saving a choice. Used for a language that comes from the profile.
            applyLanguage: function (lang) {
                document.documentElement.setAttribute('lang', lang);
                document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            },
            setLanguage: function (lang) {
                document.documentElement.setAttribute('lang', lang);
                document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
                localStorage.setItem('ml.lang', lang);
            },
            // Saves bytes the app already has (an export) as a file download. The data arrives as base64 text.
            downloadFile: function (fileName, contentType, base64) {
                var bytes = Uint8Array.from(atob(base64), function (c) { return c.charCodeAt(0); });
                var url = URL.createObjectURL(new Blob([bytes], { type: contentType }));
                var link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            }
        };
    </script>
    <script>
        // Firefox only starts a drag when data is set on dragstart, and Blazor cannot set it from C#.
        document.addEventListener('dragstart', function (e) {
            if (e.target && e.target.closest && e.target.closest('[data-kanban-card]')) {
                e.dataTransfer.setData('text/plain', 'card');
                e.dataTransfer.effectAllowed = 'move';
            }
        });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
