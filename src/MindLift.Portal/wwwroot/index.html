<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Portal · MindLift</title>
    <base href="/portal/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/MindLift.UI/css/mindlift.css" />
    <link rel="stylesheet" href="css/portal.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;font-family:'Inter',system-ui,-apple-system,sans-serif;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
                <div style="width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.3rem;box-shadow:0 4px 12px rgba(37,99,235,0.25);">
                    M
                </div>
                <span style="font-size:1.6rem;font-weight:700;color:#0f172a;letter-spacing:-0.5px;">MindLift Portal</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;font-size:0.875rem;color:#64748b;font-weight:500;">
                <span style="display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:mlspin 0.75s linear infinite;"></span>
                <span>Loading portal...</span>
            </div>
            <style>@keyframes mlspin{to{transform:rotate(360deg)}}</style>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.mindliftPortal = {
            setTheme: function (theme) { document.documentElement.setAttribute('data-theme', theme); },
            setLanguage: function (lang) {
                document.documentElement.setAttribute('lang', lang);
                document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
                localStorage.setItem('ml.portal.lang', lang);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
